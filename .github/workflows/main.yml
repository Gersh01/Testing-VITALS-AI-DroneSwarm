name: CI - Docker Compose Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test-docker-compose:
    runs-on: ubuntu-22.04

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker Compose build
      working-directory: app
      run: |
        docker build -t myapp:ci .

    - name: Docker Compose smoke test
      working-directory: app
      run: |
        docker run -d -p 8080:8080 --name myapp-container myapp:ci

    - name: Run test suite
      run: |
        ./tests/test_container.sh

    - name: Verify expected logs
      if: always()
      run: docker stop myapp-container

    - name: Remove container
      if: always()
      run: docker rm myapp-container
