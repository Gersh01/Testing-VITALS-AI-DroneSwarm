name: CI - Docker Compose Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test-docker-compose:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker Compose build
      working-directory: app
      run: |
        docker compose -f Docker-compose.yml build --pull

    - name: Docker Compose smoke test
      working-directory: app
      run: |
        docker compose -f Docker-compose.yml up --abort-on-container-exit --exit-code-from agent-d

    - name: Verify expected logs
      if: always()
      working-directory: app
      run: |
        docker compose -f Docker-compose.yml logs --no-color
        docker compose -f Docker-compose.yml logs --no-color | grep -q "Agent A is running!"
        docker compose -f Docker-compose.yml logs --no-color | grep -q "Agent B is running!"
        docker compose -f Docker-compose.yml logs --no-color | grep -q "Agent C is running!"
        docker compose -f Docker-compose.yml logs --no-color | grep -q "Agent D is running!"

    - name: Docker Compose down
      if: always()
      working-directory: app
      run: |
        docker compose -f Docker-compose.yml down -v
