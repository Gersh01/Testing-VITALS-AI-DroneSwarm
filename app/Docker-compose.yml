networks:
  vitals-network:
    driver: bridge
services:
  database:
    image: postgres:13
    environment:
      POSTGRES_USER: vitals_user
      POSTGRES_PASSWORD: vitals_password
    ports:
      - "5432:5432"
    networks:
      - vitals-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
  vitals-gcs:
    image: vitals-gcs:latest
    ports:
      - "8000:8000"
    networks:
      - vitals-network
    depends_on:
      - database
  agent-a:
    image: agent-a
    networks:
      - vitals-network
    depends_on:
      - vitals-gcs
  agent-b:
    image: agent-b
    networks:
      - vitals-network
    depends_on:
      - agent-a
  agent-c:
    image: agent-c
    networks:
      - vitals-network
    depends_on:
      - agent-b
  agent-d:
    image: agent-d 
    networks:
      - vitals-network
    depends_on:
      - agent-c


volumes:
  postgres_data: